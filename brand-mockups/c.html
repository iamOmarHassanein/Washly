<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; background:#FDFCF8; font-family:'Inter',sans-serif; overflow:hidden; position:relative; }
  .frame { position:absolute; inset:44px; border:2px solid #DCD6C6; display:flex; flex-direction:column; padding:80px 90px; }
  .top { display:flex; justify-content:space-between; align-items:center; }
  .wordmark { font-family:'Fraunces'; font-weight:600; font-size:46px; letter-spacing:0.14em; color:#0C5B3F; }
  .est { font-size:24px; font-weight:500; letter-spacing:0.22em; color:#9AA294; }
  .rule { width:120px; height:3px; background:#C9F53C; margin:190px 0 70px; }
  .headline { font-family:'Fraunces'; font-weight:500; font-size:128px; line-height:1.12; color:#0C5B3F; letter-spacing:-0.01em; }
  .headline em { font-style:italic; }
  .sub { font-size:36px; font-weight:400; color:#54604F; margin-top:70px; line-height:1.55; max-width:740px; }
  .caps { margin-top:90px; font-size:26px; font-weight:600; letter-spacing:0.3em; color:#0C5B3F; }
  .bottom { margin-top:auto; display:flex; justify-content:space-between; align-items:center; }
  .cta { font-size:32px; font-weight:600; color:#274012; background:#C9F53C; padding:28px 56px; border-radius:6px; letter-spacing:0.02em; }
  .handle { font-size:26px; font-weight:500; color:#9AA294; }
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="wordmark">WASHLY</div>
      <div class="est">MONTRÉAL · 24H</div>
    </div>
    <div class="rule"></div>
    <div class="headline">Laundry,<br><em>elevated.</em></div>
    <div class="sub">Pickup and delivery across Montréal. Washed with care, folded like a five-star hotel, back at your door in 24 hours.</div>
    <div class="caps">PICKUP · WASH · FOLD · DELIVER</div>
    <div class="bottom">
      <div class="cta">Book now</div>
      <div class="handle">@washly.mtl</div>
    </div>
  </div>
</body>
</html>
